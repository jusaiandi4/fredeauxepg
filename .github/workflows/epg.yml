name: EPG refresh

on:
  schedule:
    - cron: "0 6 * * *"        # daily 06:00 UTC (keeps the guide fresh)
  workflow_dispatch: {}         # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build EPG
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: python3 build_epg.py --m3u-url "$M3U_URL" --out _site/tvsat_usa_epg.xml.gz
      - name: Write landing page
        run: printf '<a href="tvsat_usa_epg.xml.gz">tvsat_usa_epg.xml.gz</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
